<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>FitSync Pro</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #00ff88;
            --secondary: #7c3aed;
            --dark: #0a0a0a;
            --dark-card: #1a1a1a;
            --text: #ffffff;
            --text-dim: #888888;
            --danger: #ff3b30;
            --warning: #ff9500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
            touch-action: manipulation;
            padding-bottom: 80px;
        }

        .app-header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .app-title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: var(--dark-card);
            border-radius: 15px;
            margin: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--primary);
            color: var(--dark);
        }

        .content {
            padding: 20px;
            animation: fadeIn 0.5s;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #222;
            animation: slideUp 0.3s;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            background: var(--dark);
            border: 2px solid #333;
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #00cc6a);
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: var(--dark);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .exercise-item {
            background: var(--dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-name {
            font-weight: 600;
            color: var(--primary);
        }

        .exercise-details {
            font-size: 14px;
            color: var(--text-dim);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--dark);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--dark);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        .workout-day {
            background: var(--dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }

        .meal-item {
            background: var(--dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .meal-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .macro-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .macro-badge {
            background: rgba(0, 255, 136, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #222;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .nav-label {
            font-size: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .floating-btn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            cursor: pointer;
            z-index: 99;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-content {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .timer {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="app-title">FitSync Pro 💪</div>
    </div>

    <div class="tab-container">
        <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="tab" onclick="switchTab('workout')">Treino</button>
        <button class="tab" onclick="switchTab('diet')">Dieta</button>
        <button class="tab" onclick="switchTab('profile')">Perfil</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="content">
        <div class="card">
            <div class="card-title">📊 Resumo de Hoje</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="todayCalories">0</div>
                    <div class="stat-label">Calorias</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="todayProtein">0g</div>
                    <div class="stat-label">Proteína</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="weekWorkouts">0</div>
                    <div class="stat-label">Treinos/Semana</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="currentWeight">--</div>
                    <div class="stat-label">Peso Atual</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="dailyProgress" style="width: 0%"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">�� Treino de Hoje</div>
            <div id="todayWorkoutPreview"></div>
            <button class="btn" onclick="switchTab('workout')">Iniciar Treino</button>
        </div>

        <div class="card">
            <div class="card-title">🍽️ Próxima Refeição</div>
            <div id="nextMealPreview"></div>
            <button class="btn btn-secondary" onclick="switchTab('diet')">Ver Dieta Completa</button>
        </div>
    </div>

    <!-- Workout -->
    <div id="workout" class="content hidden">
        <div class="card">
            <div class="card-title">💪 Seu Plano de Treino</div>
            <select id="workoutType" onchange="generateWorkout()">
                <option value="">Selecione o tipo</option>
                <option value="abc">ABC (3x semana)</option>
                <option value="upper-lower">Upper/Lower (4x)</option>
                <option value="push-pull-legs">Push/Pull/Legs (6x)</option>
                <option value="fullbody">Full Body (3x)</option>
            </select>
        </div>

        <div id="workoutPlan"></div>

        <div class="card">
            <div class="card-title">📝 Registrar Treino</div>
            <div class="input-group">
                <label class="label">Exercício</label>
                <input type="text" id="exerciseName" placeholder="Ex: Supino Reto">
            </div>
            <div class="stats-grid">
                <div class="input-group">
                    <label class="label">Peso (kg)</label>
                    <input type="number" id="exerciseWeight" placeholder="60">
                </div>
                <div class="input-group">
                    <label class="label">Repetições</label>
                    <input type="number" id="exerciseReps" placeholder="10">
                </div>
            </div>
            <button class="btn" onclick="logExercise()">Adicionar Exercício</button>
        </div>

        <div class="card">
            <div class="card-title">📈 Histórico</div>
            <div id="exerciseHistory"></div>
        </div>
    </div>

    <!-- Diet -->
    <div id="diet" class="content hidden">
        <div class="card">
            <div class="card-title">🎯 Metas Diárias</div>
            <div class="input-group">
                <label class="label">Objetivo</label>
                <select id="dietGoal" onchange="calculateMacros()">
                    <option value="cut">Cutting (Perder gordura)</option>
                    <option value="bulk">Bulking (Ganhar massa)</option>
                    <option value="maintain">Manutenção</option>
                </select>
            </div>
            <div id="macroTargets"></div>
        </div>

        <div class="card">
            <div class="card-title">🍽️ Plano Alimentar</div>
            <button class="btn" onclick="generateMealPlan()">Gerar Dieta Automática</button>
            <div id="mealPlan"></div>
        </div>

        <div class="card">
            <div class="card-title">➕ Adicionar Refeição</div>
            <div class="input-group">
                <label class="label">Nome</label>
                <input type="text" id="mealName" placeholder="Ex: Almoço">
            </div>
            <div class="stats-grid">
                <div class="input-group">
                    <label class="label">Calorias</label>
                    <input type="number" id="mealCalories" placeholder="500">
                </div>
                <div class="input-group">
                    <label class="label">Proteína (g)</label>
                    <input type="number" id="mealProtein" placeholder="40">
                </div>
            </div>
            <button class="btn" onclick="logMeal()">Adicionar</button>
        </div>

        <div class="card">
            <div class="card-title">📊 Resumo Nutricional</div>
            <div id="nutritionSummary"></div>
        </div>
    </div>

    <!-- Profile -->
    <div id="profile" class="content hidden">
        <div class="card">
            <div class="card-title">👤 Seus Dados</div>
            <div class="input-group">
                <label class="label">Nome</label>
                <input type="text" id="userName" placeholder="Seu nome">
            </div>
            <div class="stats-grid">
                <div class="input-group">
                    <label class="label">Idade</label>
                    <input type="number" id="userAge" placeholder="25">
                </div>
                <div class="input-group">
                    <label class="label">Sexo</label>
                    <select id="userGender">
                        <option value="male">Masculino</option>
                        <option value="female">Feminino</option>
                    </select>
                </div>
            </div>
            <div class="stats-grid">
                <div class="input-group">
                    <label class="label">Peso (kg)</label>
                    <input type="number" id="userWeight" placeholder="75">
                </div>
                <div class="input-group">
                    <label class="label">Altura (cm)</label>
                    <input type="number" id="userHeight" placeholder="175">
                </div>
            </div>
            <div class="input-group">
                <label class="label">Nível de Atividade</label>
                <select id="activityLevel">
                    <option value="1.2">Sedentário</option>
                    <option value="1.375">Leve (1-3x/semana)</option>
                    <option value="1.55">Moderado (3-5x/semana)</option>
                    <option value="1.725">Intenso (6-7x/semana)</option>
                </select>
            </div>
            <button class="btn" onclick="saveProfile()">Salvar Perfil</button>
        </div>

        <div class="card">
            <div class="card-title">📈 Evolução</div>
            <canvas id="progressChart"></canvas>
        </div>

        <div class="card">
            <div class="card-title">⚙️ Configurações</div>
            <button class="btn btn-secondary" onclick="exportData()">Exportar Dados</button>
            <button class="btn btn-danger" onclick="clearData()">Limpar Tudo</button>
        </div>
    </div>

    <!-- Floating Action Button -->
    <div class="floating-btn"
